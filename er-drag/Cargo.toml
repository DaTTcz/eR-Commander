[package]
name = "er-drag"
version = "0.1.0"
edition = "2021"
authors = ["David Trubka"]
description = "Pomocník eR Commanderu pro přetažení souborů do jiné aplikace (GTK4 drag source)"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[[bin]]
name = "er-drag"
path = "src/main.rs"

# GTK4 jen na Linuxu - na Windows řeší tažení ven eR Commander sám
# (a tenhle pomocník se tam vůbec nestaví, viz default-members v kořenovém
# Cargo.toml). Minimální GTK 4.0 - build běží v Ubuntu 22.04 (GTK 4.6).
[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = "0.9"
