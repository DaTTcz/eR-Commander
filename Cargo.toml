[package]
name = "er-commander"
version = "0.9.0"
edition = "2021"
authors = ["David Trubka"]
description = "Dvoupanelový správce souborů pro Windows a Linux postavený v Rustu (egui)"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/DaTTcz/eR-Commander"

# Workspace: eR Commander (kořen) + malý GTK4 pomocník er-drag pro
# přetažení souborů do jiné aplikace (jen Linux). `cargo build` / `cargo run`
# v kořeni staví jen eR Commander (default-members); pomocníka postaví
# `cargo build -p er-drag` nebo `cargo build --workspace` (CI).
[workspace]
members = [".", "er-drag"]
default-members = ["."]

[[bin]]
name = "eR_Commander"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "unwind"

[dependencies]
eframe = "0.28"
egui_extras = { version = "0.28", features = ["image"] }
notify = "6"
regex = "1"
walkdir = "2"
chrono = "0.4"
rayon = "1"
zip = "0.6"
sha2 = "0.10"
md5 = { package = "md-5", version = "0.10" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# Kontrola nejnovejsi verze na GitHubu (viz fetch_latest_release v main.rs) -
# stejny pristup jako v Term-IX (crates/termx-update). Samotne stazeni a
# vymenu binarky si eR Commander resi vlastnim kodem (kvuli progress baru
# v okne), takze zde staci jen "rustls" - bez archive/compression features
# potrebnych pro self_update::Update.
self_update = { version = "0.41", default-features = false, features = ["rustls"] }

# Nativní tažení souborů do jiných aplikací na Waylandu (viz modul
# native_dnd v main.rs) - napojení na stejné Wayland spojení, jaké používá
# winit; verze odpovídají těm, které už tahá eframe/winit (žádné nové knihovny).
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
raw-window-handle = "0.6"
